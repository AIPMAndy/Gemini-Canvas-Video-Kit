name: Publish Gemini Canvas Video Kit
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify links, demos, and website entry
        run: python3 scripts/smoke_test.py
      - name: Stage static pages
        shell: bash
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R examples assets _site/
          test -s _site/index.html
          test -s _site/examples/launch-showcase.html
          test -s _site/examples/knowledge-explainer.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
