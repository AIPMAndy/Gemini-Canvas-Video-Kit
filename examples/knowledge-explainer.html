<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15 秒知识科普示例 · Gemini Canvas Video Kit</title><style>
*{box-sizing:border-box}body{font-family:Inter,-apple-system,"PingFang SC",sans-serif;background:#0d1424;color:#f3f6ff;min-height:100vh;margin:0;display:grid;place-content:center;padding:22px;gap:18px}main{width:min(1100px,94vw)}.video{aspect-ratio:16/9;position:relative;border-radius:18px;background:linear-gradient(145deg,#13223c,#071323);overflow:hidden;border:1px solid #425372;cursor:pointer}.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:.3s;gap:16px;padding:10%}.scene.active{opacity:1}h1{font-size:clamp(22px,5vw,70px);letter-spacing:-.055em;line-height:1.15;text-align:center;margin:0}p{font-size:clamp(11px,1.8vw,23px);color:#b6c5dd;text-align:center;margin:0}.flow{width:90%;display:flex;gap:4%;justify-content:center;align-items:center}.block{flex:1;background:#203955;border:1px solid #5b7592;border-radius:12px;min-height:70px;padding:3%;display:grid;place-content:center;text-align:center;font-weight:700;font-size:clamp(11px,2vw,24px)}.arrow{color:#9ff6da;font-size:clamp(18px,3vw,42px)}.loop{display:flex;gap:2%;align-items:center;justify-content:center}.dot{width:12vw;height:12vw;max-width:125px;max-height:125px;border:2px solid #a5f5dc;border-radius:20px;display:grid;place-content:center;background:#21484b;font-size:clamp(14px,3vw,37px)}.caption{position:absolute;bottom:7%;left:8%;width:84%;text-align:center;font-size:clamp(12px,1.8vw,22px);color:white;background:#030c1bad;padding:9px;border-radius:7px}.tag{position:absolute;right:3%;top:4%;font-size:10px;color:#b6d2dd}button{background:#b0f6dd;border:0;border-radius:9px;color:#173530;padding:11px 18px;font-weight:700;cursor:pointer}input{accent-color:#a3f5de;flex:1}nav{display:flex;align-items:center;gap:14px;padding-top:12px}small{color:#a7bad1;line-height:1.65;display:block;padding-top:10px}.accent{color:#a6f7dd}#bar{width:0;background:#a6f7dd;height:4px;position:absolute;bottom:0;left:0}@media(max-width:620px){body{padding:8px}nav button{font-size:12px;padding:9px}small{font-size:11px}}
</style></head><body><main><div id="video" class="video"><div class="scene active"><div class="accent">15 秒讲清一件事 · 知识动画示例</div><h1>AI 为什么需要<br><span class="accent">上下文？</span></h1><p>同一句话，放在不同背景里，意思可能完全不同。</p></div><div class="scene"><h1>先看问题</h1><div class="flow"><div class="block">一句话</div><span class="arrow">→</span><div class="block">缺少背景</div><span class="arrow">→</span><div class="block">容易误解</div></div></div><div class="scene"><h1>加上上下文</h1><div class="loop"><div class="dot">问题</div><span class="arrow">+</span><div class="dot">背景</div><span class="arrow">→</span><div class="dot">回答</div></div></div><div class="scene"><h1>记住这一句</h1><p>先说明目标、条件和已有信息，AI 才更容易给出合适答案。</p></div><div class="caption" id="caption">同一句话，放在不同背景里，意思可能完全不同。</div><div class="tag">CODE-DRIVEN EXPLAINER · 概念示意</div><div id="bar"></div></div><nav><button id="play">▶ 开始播放</button><button id="replay">↺ 重播</button><input type="range" id="range" min="0" max="15000" step="100" value="0"><span id="clock">00 / 15s</span><button id="full">⛶ 全屏</button></nav><small>此示例为原创代码驱动动画，可完整自动播放并录屏。不包含专业配音，Canvas 本身不保证输出 MP4。<a href="../index.html" style="color:#a6f7dd">返回工作室</a></small></main><script>
(()=>{const $=s=>document.querySelector(s),segs=[0,4,8,12,15],lines=['同一句话，放在不同背景里，意思可能完全不同。','只给一句话，机器可能猜错你的意思。','加上目标和背景，答案会更贴近需求。','提问时，先说明目标、条件和已有信息。'];let s=0,on=false,last=0,raf=0;function draw(v){s=Math.min(15,Math.max(0,v));let idx=segs.findIndex((x,i)=>i<4&&s>=x&&s<segs[i+1]);if(idx<0)idx=3;document.querySelectorAll('.scene').forEach((el,i)=>el.classList.toggle('active',idx===i));$('#caption').textContent=lines[idx];$('#bar').style.width=(s/15*100)+'%';$('#range').value=s*1000;$('#clock').textContent=String(Math.floor(s)).padStart(2,'0')+' / 15s';if(s>=15)pause()}function tick(ts){if(!on)return;if(last){draw(s+Math.min(.1,(ts-last)/1000))}last=ts;if(on)raf=requestAnimationFrame(tick)}function pause(){on=false;cancelAnimationFrame(raf);last=0;$('#play').textContent='▶ 继续播放'}function go(reset=false){if(reset||s>=15)draw(0);if(on)return;on=true;last=0;$('#play').textContent='Ⅱ 暂停';raf=requestAnimationFrame(tick)}$('#play').onclick=()=>on?pause():go();$('#replay').onclick=()=>{pause();go(true)};$('#range').oninput=e=>{pause();draw(+e.target.value/1000)};$('#video').onclick=()=>on?pause():go();$('#full').onclick=()=>$('#video').requestFullscreen?.().catch(()=>alert('当前环境无法全屏'));draw(0)})();
</script></body></html>
